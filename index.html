<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de carro</title>


  <link rel="stylesheet" href="estilo.css">
</head>


<body>
  <h1>Jogo de carro</h1>


  <p>Use ← e → para desviar.</p>


  <p>
    Pontos: <span id="pontos">0</span> |
    Nível: <span id="nivel">1</span>
  </p>


  <p>Carros desviados: <span id="carros">0</span></p>


  <div id="pista">
    <div class="linha linha1"></div>
    <div class="linha linha2"></div>


    <div id="jogador" class="carro"></div>
    <div id="inimigo" class="carro"></div>
  </div>


  <button onclick="mover(-1)">←</button>
  <button onclick="mover(1)">→</button>
  <button onclick="location.reload()">Reiniciar</button>


  <p id="mensagem"></p>


  <script src="script.js"></script>
</body>
</html>
